<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=728,height=90" />
  <meta name="viewport" content="width=728, height=90" />
  <title>Five Journeys — Variation 1B — 728x90</title>
  <style>
    html, body { margin: 0; padding: 0; width: 728px; height: 90px; overflow: hidden; background: #faf8f5; }
    #clickArea {
      position: relative; width: 728px; height: 90px; box-sizing: border-box;
      border: 1px solid #1d3531; background: #faf8f5; color: #1a2e2a;
      font-family: Arial, Helvetica, sans-serif; cursor: pointer; overflow: hidden;
    }
    .frame { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; opacity: 0; }
    .f1 { animation: show1 12s linear forwards; }
    .f2 { animation: show2 12s linear forwards; }
    .f3 { animation: show3 12s linear forwards; }
    .hero { width: 206px; height: 100%; object-fit: cover; object-position: center 40%; flex: none; }
    .logo { height: 32px; width: auto; display: block; position: relative; flex: none; }
    .f1 .logo { margin-left: 14px; }
    .f1 p { position: relative; margin: 0 0 0 14px; font-size: 17px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
    .wash { position: absolute; right: -40px; top: -70px; width: 140px; height: 140px; border-radius: 50%; background: #5da68a; opacity: 0.16; pointer-events: none; }
    .f2, .f3 { padding: 0 16px; gap: 12px; }
    .tiers { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 16px; flex: none; }
    .tiers i { display: block; border-radius: 50%; background: #c4a15a; }
    .tiers i:nth-child(1) { width: 6px; height: 6px; }
    .tiers i:nth-child(2) { width: 9px; height: 9px; }
    .tiers i:nth-child(3) { width: 12px; height: 12px; }
    .tiers i:nth-child(4) { width: 15px; height: 15px; }
    .f2 p { position: relative; margin: 0; font-size: 15px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .f2 span { display: block; font-size: 13px; font-weight: 400; color: #3d524c; }
    .f3 p { position: relative; margin: 0; flex: 1; font-size: 16px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .cta { position: relative; flex: none; background: #264540; color: #fff; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 4px; white-space: nowrap; animation: nudge 12s ease forwards; }
    @keyframes show1 { 0%, 30% { opacity: 1; } 33.4%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 30% { opacity: 0; } 33.4%, 63.3% { opacity: 1; } 66.7%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 63.3% { opacity: 0; } 66.7%, 100% { opacity: 1; } }
    @keyframes nudge { 0%, 74% { transform: scale(1); } 80% { transform: scale(1.05); } 86%, 100% { transform: scale(1); } }
  </style>
  <script>
    var utmSource = "adroll-v1b-728x90";
    var utmCampaign = "highint_custcare";
    var clickTag = "https://fivejourneys.com/membership/?utm_source=adroll-v1b-728x90&utm_campaign=highint_custcare";
    function withUtm(url) {
      var hash = "";
      var hashAt = url.indexOf("#");
      if (hashAt !== -1) { hash = url.slice(hashAt); url = url.slice(0, hashAt); }
      if (!/[?&]utm_source=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_source=" + encodeURIComponent(utmSource);
      }
      if (!/[?&]utm_campaign=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_campaign=" + encodeURIComponent(utmCampaign);
      }
      return url + hash;
    }
    function openClickTag() {
      var match = /[?&]clickTag=([^&]+)/i.exec(window.location.search);
      window.open(withUtm(match ? decodeURIComponent(match[1]) : clickTag), "_blank");
    }
  </script>
</head>
<body>
  <div id="clickArea" onclick="openClickTag()">
    <div class="frame f1">
      <img class="hero" src="hero.jpg" alt="Dr. Wendie Trubow speaking with a patient" />
      <img class="logo" src="logo.png" alt="Five Journeys" />
      <p>Tired of rushed 10-minute doctor visits?</p>
    </div>
    <div class="frame f2">
      <div class="wash"></div>
      <div class="tiers" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p>4 tailored membership tiers<span>From foundational care to 90-minute visits &amp; 24/7 access.</span></p>
    </div>
    <div class="frame f3">
      <div class="wash"></div>
      <img class="logo" src="logo.png" alt="Five Journeys" />
      <p>Find the right plan for your health goals.</p>
      <div class="cta">Compare Memberships</div>
    </div>
  </div>
</body>
</html>
