<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=728,height=90" />
  <meta name="viewport" content="width=728, height=90" />
  <title>Five Journeys — Variation 2B — 728x90</title>
  <style>
    html, body { margin: 0; padding: 0; width: 728px; height: 90px; overflow: hidden; background: #faf8f5; }
    #clickArea {
      position: relative; width: 728px; height: 90px; box-sizing: border-box;
      border: 1px solid #1d3531; background: #faf8f5; color: #1a2e2a;
      font-family: Arial, Helvetica, sans-serif; cursor: pointer; overflow: hidden;
    }
    .frame { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; opacity: 0; }
    .f1 { animation: show1 12s linear forwards; }
    .f2 { animation: show2 12s linear forwards; }
    .f3 { animation: show3 12s linear forwards; }
    .hero { width: 200px; height: 100%; object-fit: cover; object-position: center 46%; flex: none; }
    .logo { height: 32px; width: auto; display: block; position: relative; flex: none; }
    .f1 .logo { margin-left: 12px; }
    .f1 p { position: relative; margin: 0 0 0 12px; font-size: 16px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
    .f2 { background: #e4f1eb; padding: 0 18px; }
    .f3 { padding: 0 16px; gap: 14px; }
    .wash { position: absolute; right: -30px; top: -60px; width: 160px; height: 160px; border-radius: 50%; background: #5da68a; opacity: 0.28; pointer-events: none; }
    .f3 .wash { opacity: 0.16; }
    .f2 p, .f3 p { position: relative; margin: 0; }
    .f2 p { font-size: 16px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .f3 p { flex: 1; font-size: 15px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .cta { position: relative; flex: none; background: #264540; color: #fff; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 4px; white-space: nowrap; animation: nudge 12s ease forwards; }
    @keyframes show1 { 0%, 30% { opacity: 1; } 33.4%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 30% { opacity: 0; } 33.4%, 63.3% { opacity: 1; } 66.7%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 63.3% { opacity: 0; } 66.7%, 100% { opacity: 1; } }
    @keyframes nudge { 0%, 74% { transform: scale(1); } 80% { transform: scale(1.05); } 86%, 100% { transform: scale(1); } }
  </style>
  <script>
    var utmSource = "adroll-v2b-728x90";
    var clickTag = "https://fivejourneys.com/primary-care/?utm_source=adroll-v2b-728x90";
    function withUtm(url) {
      if (/[?&]utm_source=/i.test(url)) return url;
      var hash = ""; var hashAt = url.indexOf("#");
      if (hashAt !== -1) { hash = url.slice(hashAt); url = url.slice(0, hashAt); }
      return url + (url.indexOf("?") === -1 ? "?" : "&") + "utm_source=" + encodeURIComponent(utmSource) + hash;
    }
    function openClickTag() {
      var match = /[?&]clickTag=([^&]+)/i.exec(window.location.search);
      window.open(withUtm(match ? decodeURIComponent(match[1]) : clickTag), "_blank");
    }
  </script>
</head>
<body>
  <div id="clickArea" onclick="openClickTag()">
    <div class="frame f1">
      <img class="hero" src="hero.jpg" alt="Dr. Wendie Trubow and Dr. Ed Levitan" />
      <img class="logo" src="logo.png" alt="Five Journeys" />
      <p>Not sure where to start<br>with your health?</p>
    </div>
    <div class="frame f2">
      <div class="wash"></div>
      <p>Identify hidden triggers behind weight gain, brain fog &amp; digestive issues.</p>
    </div>
    <div class="frame f3">
      <div class="wash"></div>
      <img class="logo" src="logo.png" alt="Five Journeys" />
      <p>Take our quick assessment or talk with our team.</p>
      <div class="cta">Get Started</div>
    </div>
  </div>
</body>
</html>
