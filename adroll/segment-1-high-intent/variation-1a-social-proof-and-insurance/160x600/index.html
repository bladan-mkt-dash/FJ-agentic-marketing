<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=160,height=600" />
  <meta name="viewport" content="width=160, height=600" />
  <title>Five Journeys — Variation 1A — 160x600</title>
  <style>
    html, body { margin: 0; padding: 0; width: 160px; height: 600px; overflow: hidden; background: #faf8f5; }
    #clickArea {
      position: relative;
      width: 160px;
      height: 600px;
      box-sizing: border-box;
      border: 1px solid #1d3531;
      background: #faf8f5;
      color: #1a2e2a;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      overflow: hidden;
    }
    .frame {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      opacity: 0;
      display: flex;
      flex-direction: column;
    }
    .f1 { animation: show1 12s linear forwards; }
    .f2 { animation: show2 12s linear forwards; }
    .f3 { animation: show3 12s linear forwards; }
    .hero { width: 100%; height: 148px; object-fit: cover; object-position: center 36%; flex: none; }
    .logo-chip {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(250, 248, 245, 0.94);
      border-radius: 3px;
      padding: 3px 4px;
      line-height: 0;
    }
    .logo-chip img { height: 16px; width: auto; display: block; }
    .f1-copy { flex: 1; display: flex; align-items: flex-start; padding: 16px 12px 18px; }
    .f1-copy p { margin: 0; font-size: 16px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .f2, .f3 { justify-content: center; padding: 18px 12px; box-sizing: border-box; }
    .wash {
      position: absolute;
      right: -50px;
      top: -40px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #5da68a;
      opacity: 0.16;
      pointer-events: none;
    }
    .stars { position: relative; display: flex; gap: 3px; }
    .stars svg { display: block; width: 14px; height: 14px; }
    .stat {
      position: relative;
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .stat span {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #3d6b5c;
    }
    .brand { align-self: flex-start; flex: none; position: relative; height: 28px; width: auto; display: block; }
    .prop { position: relative; margin: 16px 0 0; font-size: 15px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; }
    .ins { position: relative; margin: 8px 0 0; font-size: 13px; line-height: 1.3; color: #3d524c; }
    .cta {
      position: relative;
      align-self: flex-start;
      margin-top: 16px;
      background: #264540;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      padding: 8px 10px;
      border-radius: 4px;
      animation: nudge 12s ease forwards;
    }
    @keyframes show1 {
      0%, 30% { opacity: 1; }
      33.4%, 100% { opacity: 0; }
    }
    @keyframes show2 {
      0%, 30% { opacity: 0; }
      33.4%, 63.3% { opacity: 1; }
      66.7%, 100% { opacity: 0; }
    }
    @keyframes show3 {
      0%, 63.3% { opacity: 0; }
      66.7%, 100% { opacity: 1; }
    }
    @keyframes nudge {
      0%, 74% { transform: scale(1); }
      80% { transform: scale(1.04); }
      86%, 100% { transform: scale(1); }
    }
  </style>
  <script>
    var utmSource = "adroll-v1a-160x600";
    var utmCampaign = "highint_socprf";
    var clickTag = "https://fivejourneys.com/primary-care/?utm_source=adroll-v1a-160x600&utm_campaign=highint_socprf";
    function withUtm(url) {
      var hash = "";
      var hashAt = url.indexOf("#");
      if (hashAt !== -1) { hash = url.slice(hashAt); url = url.slice(0, hashAt); }
      if (!/[?&]utm_source=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_source=" + encodeURIComponent(utmSource);
      }
      if (!/[?&]utm_campaign=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_campaign=" + encodeURIComponent(utmCampaign);
      }
      return url + hash;
    }
    function openClickTag() {
      var match = /[?&]clickTag=([^&]+)/i.exec(window.location.search);
      var url = match ? decodeURIComponent(match[1]) : clickTag;
      window.open(withUtm(url), "_blank");
    }
  </script>
</head>
<body>
  <div id="clickArea" onclick="openClickTag()">
    <div class="frame f1">
      <img class="hero" src="hero.jpg" alt="Dr. Wendie Trubow and Dr. Ed Levitan" />
      <div class="logo-chip"><img src="logo.png" alt="Five Journeys" /></div>
      <div class="f1-copy"><p>Still searching for real health answers?</p></div>
    </div>
    <div class="frame f2">
      <div class="wash"></div>
      <div class="stars" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
      </div>
      <p class="stat">7,437+ appointments &amp; 200+ 5-star reviews<span>in Boston &amp; Newton</span></p>
    </div>
    <div class="frame f3">
      <div class="wash"></div>
      <img class="brand" src="logo.png" alt="Five Journeys" />
      <p class="prop">Concierge functional medicine.</p>
      <p class="ins">We take most insurance.</p>
      <div class="cta">Schedule Your Call</div>
    </div>
  </div>
</body>
</html>
