<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=970,height=250" />
  <meta name="viewport" content="width=970, height=250" />
  <title>Five Journeys — Variation 1A — 970x250</title>
  <style>
    html, body { margin: 0; padding: 0; width: 970px; height: 250px; overflow: hidden; background: #faf8f5; }
    #clickArea {
      position: relative;
      width: 970px;
      height: 250px;
      box-sizing: border-box;
      border: 1px solid #1d3531;
      background: #faf8f5;
      color: #1a2e2a;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      overflow: hidden;
    }
    .frame {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex;
      align-items: center;
      opacity: 0;
    }
    .f1 { animation: show1 12s linear forwards; }
    .f2 { animation: show2 12s linear forwards; }
    .f3 { animation: show3 12s linear forwards; }
    .hero { width: 496px; height: 100%; object-fit: cover; object-position: center 40%; flex: none; }
    .f1 .copy { display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 36px; }
    .logo { align-self: flex-start; flex: none; height: 42px; width: auto; display: block; }
    .f1 p { margin: 0; font-size: 28px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
    .f2, .f3 { flex-direction: column; align-items: flex-start; justify-content: center; padding: 28px 48px; box-sizing: border-box; }
    .wash {
      position: absolute;
      right: -80px;
      top: -90px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: #5da68a;
      opacity: 0.16;
      pointer-events: none;
    }
    .stars { position: relative; display: flex; gap: 6px; }
    .stars svg { display: block; width: 26px; height: 26px; }
    .stat {
      position: relative;
      margin: 16px 0 0;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .stat span {
      display: block;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #3d6b5c;
    }
    .brand { position: relative; height: 52px; width: auto; display: block; }
    .prop { position: relative; margin: 16px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
    .ins { position: relative; margin: 8px 0 0; font-size: 18px; line-height: 1.3; color: #3d524c; }
    .cta {
      position: relative;
      margin-top: 18px;
      background: #264540;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 4px;
      animation: nudge 12s ease forwards;
    }
    @keyframes show1 {
      0%, 30% { opacity: 1; }
      33.4%, 100% { opacity: 0; }
    }
    @keyframes show2 {
      0%, 30% { opacity: 0; }
      33.4%, 63.3% { opacity: 1; }
      66.7%, 100% { opacity: 0; }
    }
    @keyframes show3 {
      0%, 63.3% { opacity: 0; }
      66.7%, 100% { opacity: 1; }
    }
    @keyframes nudge {
      0%, 74% { transform: scale(1); }
      80% { transform: scale(1.05); }
      86%, 100% { transform: scale(1); }
    }
  </style>
  <script>
    var utmSource = "adroll-v1a-970x250";
    var utmCampaign = "highint_socprf";
    var clickTag = "https://fivejourneys.com/primary-care/?utm_source=adroll-v1a-970x250&utm_campaign=highint_socprf";
    function withUtm(url) {
      var hash = "";
      var hashAt = url.indexOf("#");
      if (hashAt !== -1) { hash = url.slice(hashAt); url = url.slice(0, hashAt); }
      if (!/[?&]utm_source=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_source=" + encodeURIComponent(utmSource);
      }
      if (!/[?&]utm_campaign=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_campaign=" + encodeURIComponent(utmCampaign);
      }
      return url + hash;
    }
    function openClickTag() {
      var match = /[?&]clickTag=([^&]+)/i.exec(window.location.search);
      var url = match ? decodeURIComponent(match[1]) : clickTag;
      window.open(withUtm(url), "_blank");
    }
  </script>
</head>
<body>
  <div id="clickArea" onclick="openClickTag()">
    <div class="frame f1">
      <img class="hero" src="hero.jpg" alt="Dr. Wendie Trubow and Dr. Ed Levitan" />
      <div class="copy">
        <img class="logo" src="logo.png" alt="Five Journeys" />
        <p>Still searching for<br>real health answers?</p>
      </div>
    </div>
    <div class="frame f2">
      <div class="wash"></div>
      <div class="stars" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
      </div>
      <p class="stat">7,437+ appointments &amp; 200+ 5-star reviews<span>in Boston &amp; Newton</span></p>
    </div>
    <div class="frame f3">
      <div class="wash"></div>
      <img class="brand" src="logo.png" alt="Five Journeys" />
      <p class="prop">Concierge functional medicine.</p>
      <p class="ins">We take most insurance.</p>
      <div class="cta">Schedule Your Call</div>
    </div>
  </div>
</body>
</html>
