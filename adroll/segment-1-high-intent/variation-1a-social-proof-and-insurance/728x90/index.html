<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=728,height=90" />
  <meta name="viewport" content="width=728, height=90" />
  <title>Five Journeys — Variation 1A — 728x90</title>
  <style>
    html, body { margin: 0; padding: 0; width: 728px; height: 90px; overflow: hidden; background: #faf8f5; }
    #clickArea {
      position: relative;
      width: 728px;
      height: 90px;
      box-sizing: border-box;
      border: 1px solid #1d3531;
      background: #faf8f5;
      color: #1a2e2a;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      overflow: hidden;
    }
    .frame {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex;
      align-items: center;
      opacity: 0;
    }
    .f1 { animation: show1 12s linear forwards; }
    .f2 { animation: show2 12s linear forwards; }
    .f3 { animation: show3 12s linear forwards; }
    .hero { width: 206px; height: 100%; object-fit: cover; object-position: center 42%; flex: none; }
    .logo { height: 34px; width: auto; display: block; position: relative; flex: none; }
    .f1 .logo { margin-left: 14px; }
    .f1 p, .f2 p, .f3 p { position: relative; margin: 0; }
    .f1 p {
      margin-left: 14px;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .wash {
      position: absolute;
      right: -40px;
      top: -70px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #5da68a;
      opacity: 0.16;
      pointer-events: none;
    }
    .f2, .f3 { padding: 0 16px; gap: 14px; }
    .stars { position: relative; display: flex; gap: 4px; flex: none; }
    .stars svg { display: block; width: 16px; height: 16px; }
    .f2 p { font-size: 16px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .f2 span { color: #3d6b5c; }
    .f3 p { flex: 1; font-size: 15px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .f3 span { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: #3d524c; }
    .cta {
      position: relative;
      flex: none;
      background: #264540;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 4px;
      white-space: nowrap;
      animation: nudge 12s ease forwards;
    }
    @keyframes show1 {
      0%, 30% { opacity: 1; }
      33.4%, 100% { opacity: 0; }
    }
    @keyframes show2 {
      0%, 30% { opacity: 0; }
      33.4%, 63.3% { opacity: 1; }
      66.7%, 100% { opacity: 0; }
    }
    @keyframes show3 {
      0%, 63.3% { opacity: 0; }
      66.7%, 100% { opacity: 1; }
    }
    @keyframes nudge {
      0%, 74% { transform: scale(1); }
      80% { transform: scale(1.05); }
      86%, 100% { transform: scale(1); }
    }
  </style>
  <script>
    var utmSource = "adroll-v1a-728x90";
    var utmCampaign = "highint_socprf";
    var clickTag = "https://fivejourneys.com/primary-care/?utm_source=adroll-v1a-728x90&utm_campaign=highint_socprf";
    function withUtm(url) {
      var hash = "";
      var hashAt = url.indexOf("#");
      if (hashAt !== -1) { hash = url.slice(hashAt); url = url.slice(0, hashAt); }
      if (!/[?&]utm_source=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_source=" + encodeURIComponent(utmSource);
      }
      if (!/[?&]utm_campaign=/i.test(url)) {
        url += (url.indexOf("?") === -1 ? "?" : "&") + "utm_campaign=" + encodeURIComponent(utmCampaign);
      }
      return url + hash;
    }
    function openClickTag() {
      var match = /[?&]clickTag=([^&]+)/i.exec(window.location.search);
      var url = match ? decodeURIComponent(match[1]) : clickTag;
      window.open(withUtm(url), "_blank");
    }
  </script>
</head>
<body>
  <div id="clickArea" onclick="openClickTag()">
    <div class="frame f1">
      <img class="hero" src="hero.jpg" alt="Dr. Wendie Trubow and Dr. Ed Levitan" />
      <img class="logo" src="logo.png" alt="Five Journeys" />
      <p>Still searching for real health answers?</p>
    </div>
    <div class="frame f2">
      <div class="wash"></div>
      <div class="stars" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
        <svg viewBox="0 0 20 20"><path fill="#c4a15a" d="M10 1.5l2.3 4.7 5.2.7-3.8 3.6.9 5.2L10 13.2 5.4 15.7l.9-5.2L2.5 6.9l5.2-.7z"/></svg>
      </div>
      <p>7,437+ appointments &amp; 200+ 5-star reviews <span>in Boston &amp; Newton</span></p>
    </div>
    <div class="frame f3">
      <div class="wash"></div>
      <img class="logo" src="logo.png" alt="Five Journeys" />
      <p>Concierge functional medicine.<span>We take most insurance.</span></p>
      <div class="cta">Schedule Your Call</div>
    </div>
  </div>
</body>
</html>
